name: chatgpt_bridge_client
description: Native Flutter client for ChatGPT-Web2API subscription-backed chat.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

flutter:
  uses-material-design: true

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  file_picker: ^8.1.2
  flutter_markdown: ^0.7.3+2
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  path_provider: ^2.1.4
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
