name: sloppa
description: Native Flutter client for Sloppa-Backend subscription-backed ChatGPT chat.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

flutter:
  uses-material-design: true

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  file_picker: ^12.1.1
  flutter_markdown: ^0.7.3+2
  flutter_secure_storage: ^10.3.1
  flutter_webrtc: ^1.6.0
  http: ^1.2.2
  path_provider: ^2.1.4
  talker: ^4.6.13
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
