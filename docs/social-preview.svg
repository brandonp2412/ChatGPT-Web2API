<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  
  <!-- Accent line -->
  <rect x="80" y="160" width="200" height="4" rx="2" fill="url(#accent)"/>
  
  <!-- Title -->
  <text x="80" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#ffffff">
    Sloppa
  </text>
  
  <!-- Subtitle -->
  <text x="80" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="#94a3b8">
    Turn ChatGPT into an API. No API key. No token extraction.
  </text>
  
  <!-- Feature pills -->
  <rect x="80" y="370" width="180" height="40" rx="20" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="170" y="396" font-family="system-ui, sans-serif" font-size="16" fill="#10b981" text-anchor="middle">OpenAI-Compatible</text>
  
  <rect x="280" y="370" width="140" height="40" rx="20" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
  <text x="350" y="396" font-family="system-ui, sans-serif" font-size="16" fill="#3b82f6" text-anchor="middle">MCP Server</text>
  
  <rect x="440" y="370" width="160" height="40" rx="20" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1"/>
  <text x="520" y="396" font-family="system-ui, sans-serif" font-size="16" fill="#8b5cf6" text-anchor="middle">15 Agent Tools</text>
  
  <rect x="620" y="370" width="140" height="40" rx="20" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
  <text x="690" y="396" font-family="system-ui, sans-serif" font-size="16" fill="#f59e0b" text-anchor="middle">CDP-Driven</text>

  <!-- Install command -->
  <rect x="80" y="450" width="360" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="100" y="482" font-family="SF Mono, Consolas, monospace" font-size="20" fill="#10b981">$</text>
  <text x="125" y="482" font-family="SF Mono, Consolas, monospace" font-size="20" fill="#e2e8f0">pip install sloppa</text>

  <!-- Stats -->
  <text x="80" y="560" font-family="system-ui, sans-serif" font-size="18" fill="#64748b">MIT License  •  Python 3.11+  •  29 Tests  •  3 OS CI</text>
</svg>
