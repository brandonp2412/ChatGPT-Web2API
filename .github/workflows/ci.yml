name: CI

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Keep this workflow present on the default branch so fork Actions can register it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Check imports
        run: python -c "from sloppa import __version__; from sloppa.mcp_server import create_server; from sloppa.parity_privacy_api import PrivacyParityAPIServer; print('OK v' + __version__)"
      - name: Ruff (E/F/I/UP)
        run: ruff check src/ tests/

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Gitleaks scan
        run: gitleaks detect --source . --redact --verbose

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -v -m "not e2e"

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android runner
        working-directory: client
        run: flutter create --platforms=android --project-name sloppa .
      - name: Require microphone and network permissions
        working-directory: client
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = (
              '\n    <uses-permission android:name="android.permission.INTERNET" />'
              '\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />'
          )
          if 'android.permission.RECORD_AUDIO' not in text:
              text = text.replace(marker, marker + permissions)
          path.write_text(text)
          PY
      - name: Install client dependencies
        working-directory: client
        run: flutter pub get
      - name: Check Dart formatting
        working-directory: client
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze client
        working-directory: client
        run: flutter analyze
      - name: Test client
        working-directory: client
        run: flutter test
      - name: Build Android debug APK
        working-directory: client
        run: flutter build apk --debug

  build:
    runs-on: ubuntu-latest
    needs: [lint, secret-scan, test, flutter]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build package
        run: |
          pip install build
          python -m build
      - name: Check package
        run: |
          pip install dist/*.whl
          sloppa --help
          sloppa-mcp --help
